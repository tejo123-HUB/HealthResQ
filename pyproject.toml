[project]
name = "healthresq"
version = "0.1.0"
description = "HealthResQ backend — Direction 1 (Operations & Facility Systems)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg[binary]==3.2.2",
    "alembic==1.13.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "bcrypt==4.2.0",
    "pyjwt==2.9.0",
    "httpx==0.27.2",
    "python-multipart==0.0.9",
    "pynacl==1.5.0",
    "cryptography==43.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-order==1.3.0",
]

[tool.uv]
package = false
