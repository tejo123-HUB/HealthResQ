services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthresq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthresq}
      POSTGRES_DB: ${POSTGRES_DB:-healthresq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - healthresq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthresq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-healthresq}:${POSTGRES_PASSWORD:-healthresq}@db:5432/${POSTGRES_DB:-healthresq}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-480}
      REFERENCE_INDICATOR_MODE: ${REFERENCE_INDICATOR_MODE:-mock}
      REFERENCE_INDICATOR_REFRESH_DAYS: ${REFERENCE_INDICATOR_REFRESH_DAYS:-7}
      GHO_BASE_URL: ${GHO_BASE_URL:-https://ghoapi.azureedge.net/api}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn backend.app:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the browser bundle at build time (Next.js NEXT_PUBLIC_* convention), so this
        # must be an address the browser itself can reach — the API's host-mapped port, not the
        # compose-internal service name "api".
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

  # INT-14: dedicated self-hosted graph-database upgrade path, behind GRAPH_BACKEND=memgraph.
  # Profile-gated — `docker compose up` never starts this by default (AGENTS.md's "no new
  # deployable process by default" rule); only `docker compose --profile memgraph up` does.
  # `--telemetry-enabled=false` turns off Memgraph Community's default anonymous usage telemetry.
  memgraph:
    image: memgraph/memgraph:latest
    profiles: ["memgraph"]
    restart: unless-stopped
    command: ["--telemetry-enabled=false"]
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"
      - "${MEMGRAPH_LOG_PORT:-7444}:7444"
    volumes:
      - healthresq_memgraph_data:/var/lib/memgraph

volumes:
  healthresq_pgdata:
  healthresq_memgraph_data:
